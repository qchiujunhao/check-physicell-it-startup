[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "check-physicell-it-startup"
version = "0.1.0"
description = "Monitor PhysiCell interactive tool startup on Galaxy"
requires-python = ">=3.11"
dependencies = [
    "bioblend>=1.2.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "slack-sdk>=3.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
check-physicell-startup = "helpers.monitor:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: live Galaxy monitor checks that require credentials and network access",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["config*", "helpers*"]
